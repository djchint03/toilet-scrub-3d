<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Toilet Scrub 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:system-ui;text-align:center}#game{max-width:900px;margin:auto;min-height:100vh;background:linear-gradient(#89c9ee 0 55%,#b6ad9b 55%);position:relative;overflow:hidden;padding-bottom:100px}.hud{display:flex;justify-content:space-around;background:#111d;padding:10px;font-weight:900}.arena{height:560px;position:relative;perspective:650px;overflow:hidden}.floor{position:absolute;left:-25%;right:-25%;bottom:-35%;height:80%;background:repeating-linear-gradient(90deg,transparent 0 79px,#777 80px 82px),repeating-linear-gradient(0deg,#c7c0b2 0 79px,#777 80px 82px);transform:rotateX(62deg)}.player{position:absolute;left:35%;bottom:55px;width:155px;z-index:3;filter:drop-shadow(0 7px 5px #0007);transition:.15s}.player img,.boss img{width:100%;border-radius:18px;border:4px solid white}.toilet{position:absolute;right:12%;bottom:80px;font-size:110px}.speech{position:absolute;left:10px;top:15px;background:#fff;color:#111;padding:10px;border:3px solid #111;border-radius:14px;font-weight:900;max-width:300px;z-index:9}.panel{position:absolute;right:10px;bottom:15px;background:#111e;padding:12px;border-radius:14px;width:220px}.bar{height:14px;background:#555;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#62b653;width:100%}.controls{position:absolute;bottom:15px;left:10px;display:grid;grid-template-columns:70px 70px;gap:8px;z-index:10}button{min-height:54px;border:0;border-radius:12px;font-weight:900;font-size:16px}.scrub{background:#ffe45b;width:100%;margin-top:8px}.boss{position:absolute;right:20px;bottom:65px;width:210px;z-index:5}.bossbar{position:absolute;left:10%;right:10%;top:90px;background:#111e;padding:8px;border-radius:12px;font-weight:900}.hidden{display:none}.win{font-size:28px;font-weight:1000}@media(max-width:600px){.arena{height:510px}.player{width:120px;left:30%}.boss{width:155px}.toilet{font-size:85px}.speech{max-width:230px;font-size:12px}.panel{width:175px}.controls{grid-template-columns:60px 60px}}</style></head><body><main id='game'><div class='hud'><span>💵 <b id='cash'>$0</b></span><span>🚽 <b id='cleaned'>0</b></span><span>WORLD <b id='level'>1</b></span></div><section class='arena'><div class='floor'></div><div id='speech' class='speech'>Another toilet? Y'all are absolutely disgusting. 💀</div><div id='player' class='player'><img src='player.jpeg' alt='Player character'></div><div id='toilet' class='toilet'>🚽</div><div id='panel' class='panel'><b>TOILET GRIME <span id='grimeTxt'>100%</span></b><div class='bar'><i id='grimeBar'></i></div><button id='scrub' class='scrub'>🧽 SCRUB</button></div><div id='boss' class='boss hidden'><img src='boss.jpeg' alt='Final boss'></div><div id='bossbar' class='bossbar hidden'>FINAL BOSS: GYM GUY 💀<div class='bar'><i id='bossHp'></i></div></div><div class='controls'><button id='left'>⬅️</button><button id='right'>➡️</button><button id='jump'>⬆️</button><button id='dodge'>💨</button></div></section><div id='message'>Scrub toilets, stack cash, survive until the final boss.</div></main><script>(()=>{let cash=0,cleaned=0,level=1,grime=100,bossHP=100,bossMode=false;const $=x=>document.getElementById(x);const lines=['WHO did this?! 💀','Bro. Flushing is FREE.','This bowl needs an exorcism.','I need hazard pay immediately.','There is not enough bleach on Earth. 😭','Whoever used this last owes me an apology.','This toilet has committed crimes.','I better see overtime on my check.'];function say(t){$('speech').textContent=t}function hud(){$('cash').textContent='$'+cash;$('cleaned').textContent=cleaned;$('level').textContent=level}function scrub(){if(bossMode){bossHP=Math.max(0,bossHP-10);cash+=10;$('bossHp').style.width=bossHP+'%';say(['You call THAT a boss fight?','Those tattoos cannot save you now. 💀','Welcome to the sanitation department.','I scrub harder than you lift. 😭'][Math.floor(Math.random()*4)]);if(!bossHP){$('boss').classList.add('hidden');$('bossbar').innerHTML='<div class="win">🏆 BOSS DEFEATED</div>';say('CLEANED THE WHOLE BUILDING. PAY ME. 💰');$('message').textContent='YOU WIN — Final boss defeated!';}hud();return}grime=Math.max(0,grime-10);cash+=4;$('grimeBar').style.width=grime+'%';$('grimeTxt').textContent=grime+'%';say(lines[Math.floor(Math.random()*lines.length)]);if(!grime){cleaned++;cash+=50;level++;grime=100;$('grimeBar').style.width='100%';$('grimeTxt').textContent='100%';if(cleaned>=5){bossMode=true;$('toilet').classList.add('hidden');$('panel').classList.add('hidden');$('boss').classList.remove('hidden');$('bossbar').classList.remove('hidden');say('OH NO... the final boss came straight from the gym. 💀');$('message').textContent='FINAL BOSS — scrub attack him until his health reaches zero!'}else{say('✨ Spotless. Next nasty toilet unlocked. +$50');$('message').textContent='Level '+level+' — the toilets are getting worse.'}}hud()}$('scrub').onclick=scrub;$('left').onclick=()=>{$('player').style.left='18%'};$('right').onclick=()=>{$('player').style.left='48%'};$('jump').onclick=()=>{let p=$('player');p.style.bottom='180px';setTimeout(()=>p.style.bottom='55px',300);say('Housekeeping parkour!')};$('dodge').onclick=()=>{let p=$('player');p.style.transform='translateX(-70px) rotate(-8deg)';setTimeout(()=>p.style.transform='',250);say('Not today! 💨')};hud()})();</script></body></html>
